<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datalinker</title>
  <script type="module" crossorigin src="/site-datalinker/assets/index.cd9e2b8d.js"></script>
  <link rel="stylesheet" href="/site-datalinker/assets/index.c7dc9946.css">
</head>
<body>
    <div id="root"></div>
    <!-- Garantir que, se não houver hash na URL, a aplicação use a rota Home (/#/) -->
    <script>
        (function() {
            try {
                if (!location.hash || location.hash === '') {
                    location.replace(location.pathname + location.search + '#/');
                }
            } catch (e) {
                console.error(e);
            }
        })();
    </script>
    
</body>
</html>
