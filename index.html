<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        /* Override crítico para garantir contraste em hot cache / CDN edge antigo */
        .hero, .hero h1, .hero p {
            color: #ffffff !important;
        }
        .hero h1 {
            font-size: 3.5rem !important;
            font-weight: 700 !important;
            text-shadow: 0 2px 8px rgba(0,0,0,0.35) !important;
        }
        .hero p {
            font-size: 1.5rem !important;
            font-weight: 600 !important;
            text-shadow: 0 1px 6px rgba(0,0,0,0.25) !important;
        }
        .hero a,
        .btn-primary,
        .btn-secondary,
        .btn-whatsapp,
        .footer a,
        .footer a:visited {
            color: #ffffff !important;
            text-decoration: none !important;
        }

        #static-header a,
        #static-header a:visited {
            color: #1e40af !important;
            text-decoration: none !important;
        }

        #static-header a:hover,
        #static-header a:focus {
            color: #ffffff !important;
            background: #1e40af !important;
            border-radius: 8px;
        }

        .hero a:hover,
        .hero a:focus {
            color: #4da6ff !important;
            text-decoration: none !important;
        }

        /* Preloader */
        #preloader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            z-index: 3000;
        }

        .preloader-spinner {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 6px solid #e6eefc;
            border-top-color: #1e40af;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <meta name="theme-color" content="#1e40af">
    <meta property="og:title" content="DataLinker - Especialistas em e-SUS para UBS">
    <meta property="og:description" content="Especialistas em implantação e suporte do sistema e-SUS PEC para Unidades Básicas de Saúde.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/logo.svg">
    <meta name="twitter:card" content="summary_large_image">
  <script type="module" crossorigin src="/site-datalinker/assets/index.885fda81.js"></script>
  <link rel="stylesheet" href="/site-datalinker/assets/index.e18e5a13.css">
</head>
<body>
    <div id="preloader" aria-hidden="false">
        <div class="preloader-spinner" aria-hidden="true"></div>
    </div>
    <header id="static-header" style="display:flex;align-items:center;justify-content:space-between;padding:0.8rem 1.5rem;background:rgba(255,255,255,0.95);border-bottom:1px solid #e2e8f0;position:fixed;top:0;left:0;right:0;z-index:2000;box-shadow:0 4px 20px rgba(0,0,0,0.08);">
        <div style="display:flex;align-items:center;gap:0.65rem;">
            <img src="/site-datalinker/logo.svg" alt="DataLinker" style="height:36px;width:auto;">
            <span style="font-size:1.35rem;font-weight:700;color:#1e40af;">DataLinker</span>
        </div>
        <nav style="display:flex;gap:0.85rem;">
            <a href="/#/" style="font-weight:600;color:#1e40af;text-decoration:none;padding:0.45rem 0.7rem;border-radius:8px;">Home</a>
            <a href="/#/about" style="font-weight:600;color:#1e40af;text-decoration:none;padding:0.45rem 0.7rem;border-radius:8px;">Sobre Nós</a>
            <a href="/#/services" style="font-weight:600;color:#1e40af;text-decoration:none;padding:0.45rem 0.7rem;border-radius:8px;">Serviços</a>
            <a href="/#/team" style="font-weight:600;color:#1e40af;text-decoration:none;padding:0.45rem 0.7rem;border-radius:8px;">Equipe</a>
            <a href="/#/contact" style="font-weight:600;color:#1e40af;text-decoration:none;padding:0.45rem 0.7rem;border-radius:8px;">Contato</a>
        </nav>
    </header>
    <div style="height:74px;"></div>
    <div id="root"></div>
    <script>
        (function() {
            try {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        registrations.forEach(function(reg) { reg.unregister(); });
                    });
                }
                if (!location.hash || location.hash === '') {
                    location.replace(location.pathname + location.search + '#/');
                }
                window.addEventListener('load', function() {
                    var sh = document.getElementById('static-header');
                    var pre = document.getElementById('preloader');
                    if (sh) {
                        sh.style.display = 'none';
                    }
                    if (pre) {
                        pre.style.display = 'none';
                        pre.setAttribute('aria-hidden', 'true');
                    }
                });
            } catch (e) {
                console.error(e);
            }
        })();
    </script>
    
</body>
</html>
