<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datalinker</title>
</head>
<body>
    <div id="root"></div>
    <!-- Garantir que, se não houver hash na URL, a aplicação use a rota Home (/#/) -->
    <script>
        (function() {
            try {
                if (!location.hash || location.hash === '') {
                    location.replace(location.pathname + location.search + '#/');
                }
            } catch (e) {
                console.error(e);
            }
        })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
